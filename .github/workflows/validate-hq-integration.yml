name: Validate HQ integration and build combined ZIP

on:
  push:
    branches:
      - integration/time-agent-hq-main-20261113
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hq-integration-validation
  cancel-in-progress: false

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate rules, existing gameplay, resume, stats and random contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rulebook.py check
          python3 scripts/check_hq_release_contract.py
          python3 scripts/test_rulebook_contract.py
          python3 scripts/test_resume_semantics.py
          python3 scripts/test_stat_generation.py
          python3 scripts/test_python_random.py
          python3 scripts/rulebook.py export
          git diff --check
      - name: Commit matching combined game ZIP to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/TRPG-RULE-project.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build verified combined HQ game ZIP"
            git push origin HEAD:integration/time-agent-hq-main-20261113
          fi
